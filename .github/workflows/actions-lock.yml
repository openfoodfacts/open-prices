name: Verify Actions Lock

on:
  pull_request:
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".github/workflows/actions.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".github/workflows/actions.lock"

permissions:
  contents: read

jobs:
  verify:
    name: Verify workflow dependencies
    runs-on: ubuntu-slim

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actions-lock extension
        run: gh extension install github/gh-actions-lock --pin v0.5.1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify workflow dependencies
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
