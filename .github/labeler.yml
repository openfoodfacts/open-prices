# Add labels to any pull request with changes to the specified paths

📚 Documentation:
- changed-files:
  - any-glob-to-any-file:
    - 'docs/**'
    - 'mkdocs.yml'
    - 'build_mkdocs.sh'
    - 'README.md'
    - 'CONTRIBUTING.md'
    - 'INSTALL.md'
    - 'API.md'
    - 'AGENTS.md'

